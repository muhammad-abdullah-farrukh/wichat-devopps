name: Staging Pipeline (Push to Main → Staging Server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (all services)
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Build React webapp
        run: npm --prefix webapp run build
        env:
          CI: false

  # ─────────────────────────────────────────────
  # 2. UNIT TESTS
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Run unit tests with coverage
        run: |
          npm --prefix users/authservice test -- --coverage --watchAll=false
          npm --prefix users/userservice test -- --coverage --watchAll=false
          npm --prefix llmservice test -- --coverage --watchAll=false
          npm --prefix questionservice test -- --coverage --watchAll=false
          npm --prefix gatewayservice test -- --coverage --watchAll=false
          npm --prefix webapp test -- --coverage --watchAll=false

  # ─────────────────────────────────────────────
  # 3. LINTING / CODE ANALYSIS
  # ─────────────────────────────────────────────
  lint:
    name: Code Analysis & Linting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Run ESLint on all services
        run: |
          npx eslint users/authservice/*.js  --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint users/userservice/*.js  --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint gatewayservice/*.js     --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint llmservice/*.js         --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint questionservice/*.js    --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          cd webapp && npx eslint src --ext .js,.jsx --no-eslintrc -c '{"env":{"browser":true,"es2021":true},"rules":{"no-unused-vars":"warn"}}' || true

  # ─────────────────────────────────────────────
  # 4. BUILD DOCKER IMAGES & PUSH TO AWS ECR
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Images to ECR
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all service images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg REACT_APP_API_ENDPOINT=http://${{ secrets.STAGING_HOST }}:8000 \
            -t $ECR_REGISTRY/wichat-webapp:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-webapp:latest \
            ./webapp
          docker push $ECR_REGISTRY/wichat-webapp:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-webapp:latest

          docker build \
            -t $ECR_REGISTRY/wichat-authservice:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-authservice:latest \
            ./users/authservice
          docker push $ECR_REGISTRY/wichat-authservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-authservice:latest

          docker build \
            -t $ECR_REGISTRY/wichat-userservice:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-userservice:latest \
            ./users/userservice
          docker push $ECR_REGISTRY/wichat-userservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-userservice:latest

          docker build \
            --build-arg FRONTEND_URL=http://${{ secrets.STAGING_HOST }}:3000 \
            -t $ECR_REGISTRY/wichat-gatewayservice:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-gatewayservice:latest \
            ./gatewayservice
          docker push $ECR_REGISTRY/wichat-gatewayservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-gatewayservice:latest

          docker build \
            --build-arg LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            --build-arg GEMINI_LLM_API_KEY=${{ secrets.GEMINI_LLM_API_KEY }} \
            -t $ECR_REGISTRY/wichat-llmservice:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-llmservice:latest \
            ./llmservice
          docker push $ECR_REGISTRY/wichat-llmservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-llmservice:latest

          docker build \
            -t $ECR_REGISTRY/wichat-questionservice:$IMAGE_TAG \
            -t $ECR_REGISTRY/wichat-questionservice:latest \
            ./questionservice
          docker push $ECR_REGISTRY/wichat-questionservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/wichat-questionservice:latest

  # ─────────────────────────────────────────────
  # 5. DEPLOY TO STAGING EC2
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload docker-compose and monitoring configs
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          source: "docker-compose.yml,gatewayservice/monitoring"
          target: "~/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            export ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"
            export LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
            export GEMINI_LLM_API_KEY="${{ secrets.GEMINI_LLM_API_KEY }}"
            export REACT_APP_API_ENDPOINT="http://${{ secrets.STAGING_HOST }}:8000"
            export FRONTEND_URL="http://${{ secrets.STAGING_HOST }}:3000"

            docker compose --profile prod down || true
            docker compose --profile prod pull
            docker compose --profile prod up -d

            sleep 15
            echo "Deployment to Staging EC2 complete."

  # ─────────────────────────────────────────────
  # 6a. NOTIFY ON FAILURE
  # ─────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, unit-tests, lint, docker-build-push, deploy-staging]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Staging Pipeline FAILED — ${{ github.repository }}"
          to: sajid.ali@giki.edu.pk,${{ secrets.DEV1_EMAIL }},${{ secrets.DEV2_EMAIL }}
          from: WiChat CI <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Hello,

            The Staging CI/CD pipeline has FAILED for a push to the main branch.

            Repository  : ${{ github.repository }}
            Commit SHA  : ${{ github.sha }}
            Pushed by   : ${{ github.actor }}
            Message     : ${{ github.event.head_commit.message }}

            Check the Actions logs here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            WiChat CI Bot

  # ─────────────────────────────────────────────
  # 6b. NOTIFY QA ON SUCCESS
  # ─────────────────────────────────────────────
  notify-success:
    name: Notify QA on Staging Success
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: success()
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Changes Deployed to STAGING — ${{ github.repository }}"
          to: sajid.ali@giki.edu.pk
          from: WiChat CI <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Hello Sir,

            The latest changes have been built, containerized via Docker,
            pushed to AWS ECR, and deployed to the STAGING environment.

            ─── Commit Details ──────────────────────────────
            Repository  : ${{ github.repository }}
            Commit SHA  : ${{ github.sha }}
            Pushed by   : ${{ github.actor }}
            Message     : ${{ github.event.head_commit.message }}
            Branch      : main

            ─── Docker Images (AWS ECR) ─────────────────────
            Registry    : ${{ secrets.ECR_REGISTRY }}
            Image Tag   : ${{ github.sha }}

            ─── Access the Staging App ──────────────────────
            Frontend    : http://${{ secrets.STAGING_HOST }}:3000
            API         : http://${{ secrets.STAGING_HOST }}:8000

            All checks passed:
              ✔ Build successful
              ✔ Unit tests passed
              ✔ Linting clean
              ✔ Docker images pushed to ECR
              ✔ Deployed to Staging EC2

            This build is ready for final review.

            Regards,
            WiChat CI Bot
