name: Staging Pipeline (Push to Main → Staging Server)

on:
  push:
    branches:
      - main
  workflow_dispatch:   # manual trigger button

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (all services)
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Build React webapp
        run: npm --prefix webapp run build
        env:
          CI: false

  # ─────────────────────────────────────────────
  # 2. UNIT TESTS
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Run unit tests with coverage
        run: |
          npm --prefix users/authservice test -- --coverage --watchAll=false
          npm --prefix users/userservice test -- --coverage --watchAll=false
          npm --prefix llmservice test -- --coverage --watchAll=false
          npm --prefix questionservice test -- --coverage --watchAll=false
          npm --prefix gatewayservice test -- --coverage --watchAll=false
          npm --prefix webapp test -- --coverage --watchAll=false

  # ─────────────────────────────────────────────
  # 3. LINTING / CODE ANALYSIS
  # ─────────────────────────────────────────────
  lint:
    name: Code Analysis & Linting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm --prefix users/authservice ci
          npm --prefix users/userservice ci
          npm --prefix llmservice ci
          npm --prefix questionservice ci
          npm --prefix gatewayservice ci
          npm --prefix webapp ci

      - name: Run ESLint on all services
        run: |
          npx eslint users/authservice/*.js  --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint users/userservice/*.js  --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint gatewayservice/*.js     --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint llmservice/*.js         --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          npx eslint questionservice/*.js    --no-eslintrc -c '{"env":{"node":true,"es2021":true},"rules":{"no-unused-vars":"warn","no-console":"off"}}' || true
          cd webapp && npx eslint src --ext .js,.jsx --no-eslintrc -c '{"env":{"browser":true,"es2021":true},"rules":{"no-unused-vars":"warn"}}' || true

  # ─────────────────────────────────────────────
  # 4. DEPLOY TO STAGING EC2
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload docker-compose to Staging server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/"
          overwrite: true

      - name: Upload Prometheus config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          source: "./gatewayservice/monitoring/prometheus/"
          target: "~/"
          overwrite: true

      - name: Upload Grafana config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          source: "./gatewayservice/monitoring/grafana/"
          target: "~/"
          overwrite: true

      - name: Deploy on Staging server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          script: |
            export LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
            export GEMINI_LLM_API_KEY="${{ secrets.GEMINI_LLM_API_KEY }}"
            export REACT_APP_API_ENDPOINT="http://${{ secrets.STAGING_HOST }}:8000"
            export FRONTEND_URL="http://${{ secrets.STAGING_HOST }}:3000"

            docker compose --profile prod down || true
            docker compose --profile prod pull
            docker compose --profile prod up -d

            sleep 15
            echo "✅ Deployment complete on Staging server."

  # ─────────────────────────────────────────────
  # 5a. EMAIL ON FAILURE
  # ─────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, unit-tests, lint, deploy-staging]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Staging Pipeline FAILED — commit ${{ github.sha }} (${{ github.repository }})"
          to: sajid.ali@giki.edu.pk,${{ github.event.pusher.email }}
          from: WiChat CI <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Hello,

            The Staging CI/CD pipeline has FAILED for a push to the main branch.

            Repository  : ${{ github.repository }}
            Commit      : ${{ github.sha }}
            Pushed by   : ${{ github.actor }}
            Commit Msg  : ${{ github.event.head_commit.message }}

            Please check the Actions tab for details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            WiChat CI Bot

  # ─────────────────────────────────────────────
  # 5b. EMAIL ON SUCCESS
  # ─────────────────────────────────────────────
  notify-success:
    name: Notify QA on Staging Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: success()
    steps:
      - name: Send success email to QA / Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Changes Deployed to STAGING — ${{ github.repository }}"
          to: sajid.ali@giki.edu.pk
          from: WiChat CI <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Hello Sir,

            The latest changes have been successfully deployed to the STAGING environment.

            ─── Commit Details ─────────────────────────────
            Repository  : ${{ github.repository }}
            Commit SHA  : ${{ github.sha }}
            Pushed by   : ${{ github.actor }}
            Message     : ${{ github.event.head_commit.message }}
            Branch      : main

            ─── Access the Staging App ──────────────────────
            Frontend    : http://${{ secrets.STAGING_HOST }}:3000
            API Gateway : http://${{ secrets.STAGING_HOST }}:8000

            All checks passed:
              ✔ Build successful
              ✔ Unit tests passed
              ✔ Linting clean
              ✔ Deployed to Staging EC2

            This build is ready for final client review.

            Regards,
            WiChat CI Bot
